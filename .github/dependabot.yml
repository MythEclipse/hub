version: 2
updates:
  # Dependabot has no "pnpm" YAML value: GitHub's supported-ecosystems table maps
  # the pnpm package manager to "npm", and it picks up pnpm-lock.yaml there.
  # Changing this to "pnpm" would make the config invalid and stop all updates.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
