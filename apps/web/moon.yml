$schema: https://moonrepo.dev/schemas/project.json

language: "typescript"

# Root manifests that web:build depends on. Project task inputs reject `../`
# traversal, so the lockfile cannot be named directly from here; a leading `/`
# anchors the path to the workspace root instead. This must live in the project
# config: global `fileGroups` in .moon/tasks.yml are not inherited by moon 2.6,
# and a bare `@name(...)` token is parsed as a literal filename — which silently
# hashed a path that never exists and disabled the invalidation it promised.
fileGroups:
  rootManifests:
    - "/package.json"
    - "/pnpm-lock.yaml"
    - "/pnpm-workspace.yaml"

tasks:
  dev:
    command: "pnpm run dev"
    preset: "server"
    deps:
      - "api:dev"

  build:
    command: "pnpm run build"
    # public/** is copied verbatim into dist/ and the lockfile/package.json
    # change the deps, but both were invisible to the hash — so a favicon
    # change or a dependency bump rebuilt nothing and shipped the previous
    # bundle. Verified: appending a byte to public/favicon.ico left dist stale.
    inputs:
      - "src/**/*"
      - "public/**/*"
      - "tsconfig.json"
      - "vite.config.ts"
      - "index.html"
      - "package.json"
      # `@group(name)` expands the file group defined above; without the `@`
      # the entry is a plain path, and a `@name(...)` form is not a token at
      # all — moon records it verbatim and the hash never changes.
      - "@group(rootManifests)"
    outputs:
      - "dist/**/*"

  typecheck:
    command: "pnpm run typecheck"
    inputs:
      - "src/**/*"
      - "tsconfig.json"

  test:
    command: "pnpm run test"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "package.json"
